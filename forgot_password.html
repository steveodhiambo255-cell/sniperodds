<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNIPER ODDS — Forgot Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#07110d;--panel:#0d1b15;--line:#244536;--green:#25d366;--text:#f4f7f5;--muted:#91a69c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(420px,92%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
h1{margin:0 0 6px;font-size:24px}
p.sub{margin:0 0 20px;color:var(--muted)}
label{display:block;margin:12px 0 6px;font-size:14px;color:var(--muted)}
input{width:100%;padding:13px;border-radius:8px;border:1px solid var(--line);background:#07110d;color:var(--text);font-size:16px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:8px;background:var(--green);color:#04210f;font-size:16px;font-weight:bold}
button:disabled{opacity:.6}
.links{margin-top:16px;text-align:center;font-size:14px}
a{color:var(--green);text-decoration:none}
#resetMessage{margin-top:14px;font-size:14px;min-height:18px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <h1>Forgot password?</h1>
  <p class="sub">Enter your email and we'll send you a reset link.</p>

  <form id="resetForm">
    <label for="resetEmail">Email</label>
    <input id="resetEmail" type="email" autocomplete="email" required>
    <button type="submit" id="resetBtn">Send reset link</button>
    <div id="resetMessage"></div>
  </form>

  <div class="links"><a href="login.html">Back to login</a></div>
</div>

<!-- Existing project JavaScript (provides supabaseClient) -->
<script src="script.js"></script>

<script>
document.getElementById("resetForm").addEventListener("submit", async function (e) {
  e.preventDefault();
  var btn = document.getElementById("resetBtn");
  var message = document.getElementById("resetMessage");
  var email = document.getElementById("resetEmail").value.trim();

  btn.disabled = true;
  message.style.color = "#91a69c";
  message.textContent = "Sending...";

  try {
    var redirectUrl = new URL("reset_password.html", window.location.href).href;

    var result = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: redirectUrl
    });

    if (result.error) {
      message.style.color = "#ff7b7b";
      message.textContent = "Error: " + result.error.message;
    } else {
      message.style.color = "#25d366";
      message.textContent = "Reset link sent. Check your email (and spam folder).";
    }
  } catch (err) {
    message.style.color = "#ff7b7b";
    message.textContent = "System error: " + err.message;
  }

  btn.disabled = false;
});
</script>
</body>
</html>
