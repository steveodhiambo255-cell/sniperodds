<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SNIPER ODDS — Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--bg:#07110d;--panel:#0d1b15;--line:#244536;--green:#25d366;--text:#f4f7f5;--muted:#91a69c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{width:min(420px,92%);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
h1{margin:0 0 6px;font-size:24px}
p.sub{margin:0 0 20px;color:var(--muted)}
label{display:block;margin:12px 0 6px;font-size:14px;color:var(--muted)}
input{width:100%;padding:13px;border-radius:8px;border:1px solid var(--line);background:#07110d;color:var(--text);font-size:16px}
button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:8px;background:var(--green);color:#04210f;font-size:16px;font-weight:bold}
button:disabled{opacity:.5}
.links{margin-top:16px;text-align:center;font-size:14px}
a{color:var(--green);text-decoration:none}
#resetMessage{margin-top:14px;font-size:14px;min-height:18px;color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your SNIPER ODDS account.</p>

  <form id="newPasswordForm">
    <label for="newPassword">New password</label>
    <input id="newPassword" type="password" minlength="6" autocomplete="new-password" required>

    <label for="confirmPassword">Confirm password</label>
    <input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required>

    <button type="submit" id="saveBtn" disabled>Update password</button>
    <div id="resetMessage">Checking your reset link...</div>
  </form>

  <div class="links"><a href="login.html">Back to login</a></div>
</div>

<!-- Existing project JavaScript (provides supabaseClient) -->
<script src="script.js"></script>

<script>
(function () {
  var btn = document.getElementById("saveBtn");
  var message = document.getElementById("resetMessage");

  function say(text, color) {
    message.style.color = color || "#91a69c";
    message.textContent = text;
  }

  // Enable the form once Supabase confirms the reset link is valid
  function ready() {
    btn.disabled = false;
    say("");
  }

  supabaseClient.auth.onAuthStateChange(function (event, session) {
    if (event === "PASSWORD_RECOVERY" || (session && event === "SIGNED_IN")) {
      ready();
    }
  });

  // Fallback: link already processed before the listener attached
  supabaseClient.auth.getSession().then(function (res) {
    if (res.data && res.data.session) {
      ready();
    } else {
      setTimeout(function () {
        if (btn.disabled) {
          say("This reset link is invalid or has expired. Request a new one from the login page.", "#ff7b7b");
        }
      }, 2500);
    }
  });

  document.getElementById("newPasswordForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var pw = document.getElementById("newPassword").value;
    var confirmPw = document.getElementById("confirmPassword").value;

    if (pw.length < 6) {
      say("Password must be at least 6 characters.", "#ff7b7b");
      return;
    }
    if (pw !== confirmPw) {
      say("Passwords do not match.", "#ff7b7b");
      return;
    }

    btn.disabled = true;
    say("Updating...");

    try {
      var result = await supabaseClient.auth.updateUser({ password: pw });

      if (result.error) {
        say("Error: " + result.error.message, "#ff7b7b");
        btn.disabled = false;
        return;
      }

      say("Password updated! Redirecting to login...", "#25d366");
      await supabaseClient.auth.signOut();
      setTimeout(function () { window.location.href = "login.html"; }, 1500);
    } catch (err) {
      say("System error: " + err.message, "#ff7b7b");
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
