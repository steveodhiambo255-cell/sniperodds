<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>M-Pesa Payment - SNIPER ODDS</title>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- SNIPER ODDS Styles -->
    <link rel="stylesheet" href="style.css">

</head>


<body>


<!-- ==========================================
     HEADER
     ========================================== -->

<header class="header">

    <div class="logo">
        SNIPER <span>ODDS</span>
    </div>

    <button
        class="login-btn"
        type="button"
        onclick="window.location.href='subscription.html'">

        Plans

    </button>

</header>


<!-- ==========================================
     PAYMENT PAGE
     ========================================== -->

<main class="auth-page">

    <div class="auth-box">


        <!-- PAGE TITLE -->

        <p class="small-title">
            SNIPER ODDS PREMIUM
        </p>


        <h1>
            M-Pesa Payment
        </h1>


        <p class="auth-text">
            Complete your payment to unlock
            premium football predictions.
        </p>


        <!-- ======================================
             SELECTED PLAN
             ====================================== -->

        <div class="account-card">

            <p>
                <strong>
                    Selected Plan:
                </strong>
            </p>

            <h2 id="selectedPlan">
                Loading...
            </h2>


            <p>
                <strong>
                    Amount:
                </strong>
            </p>

            <h2 id="selectedAmount">
                KSh 0
            </h2>

        </div>


        <!-- ======================================
             PHONE NUMBER
             ====================================== -->

        <label for="mpesaPhone">

            M-Pesa Phone Number

        </label>


        <input
            type="tel"
            id="mpesaPhone"
            placeholder="07XXXXXXXX"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel">


        <!-- ======================================
             PAYMENT BUTTON
             ====================================== -->

        <button
            id="payButton"
            class="primary-btn full-btn"
            type="button"
            onclick="startPayment()">

            Pay with M-Pesa

        </button>


        <!-- ======================================
             PAYMENT MESSAGE
             ====================================== -->

        <p
            id="paymentMessage"
            class="form-message"
            aria-live="polite">
        </p>


        <!-- ======================================
             BACK TO PLANS
             ====================================== -->

        <p class="switch-auth">

            <a href="subscription.html">

                ← Back to Plans

            </a>

        </p>


    </div>

</main>


<!-- ==========================================
     MAIN SNIPER ODDS SCRIPT
     ========================================== -->

<script src="script.js"></script>


</body>

</html>
